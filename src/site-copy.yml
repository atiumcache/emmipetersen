# About Page
about:
  heading: "Hi, I'm Emmi."
  description: "Your personal strength coach helping you achieve your fitness goals"
  content: "I am a strength coach based in San Francisco and Mill Valley who is always growing, reflecting, and working to examine my own relationship with movement. I’ve been immersed in fitness culture since 2014, questioning it since 2020, and formally training my own clients since 2023. "
  content2: "I find joy in building strength, connecting with my body and community, and being playful with the way I move about this world."
  content3: "Through learning, listening, and adapting, I aim to create a space that feels safe, welcoming, and accessible to individuals in all bodies. "
  content4: "I work best with beginner to intermediate lifters looking to build lifelong strength in any body. I love challenging clients to try new things, explore their capabilities, and seek movement that they actually enjoy."
  content5: "Whether you choose to work with me in San Francisco or Mill Valley, I will invite you into a judgment-free space and meet you exactly where you are in your journey toward a stronger self."
